<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a glass of milk, sent with love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:#171a35;
    --night-mid:#282a58;
    --night-plum:#3a2f5e;
    --milk:#fff6e6;
    --milk-highlight:#fffdf6;
    --moon:#f6d98c;
    --rose:#e6a4bd;
    --star:#fdf4d8;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background:var(--night-deep);
    overflow:hidden;
    font-family:'Quicksand', sans-serif;
  }

  .sky{
    position:relative;
    width:100%;
    height:100vh;
    background:
      radial-gradient(ellipse 80% 60% at 50% 100%, var(--night-plum) 0%, transparent 70%),
      linear-gradient(180deg, var(--night-deep) 0%, var(--night-mid) 55%, var(--night-plum) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* stars */
  .stars{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
  }
  .star{
    position:absolute;
    width:2px; height:2px;
    background:var(--star);
    border-radius:50%;
    animation:twinkle 3.5s ease-in-out infinite;
    opacity:0.3;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(1); }
    50%{ opacity:0.95; transform:scale(1.6); }
  }

  /* moon */
  .moon{
    position:absolute;
    top:8%; right:12%;
    width:64px; height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fffbe8, var(--moon) 60%, #e0b968 100%);
    box-shadow:0 0 40px 10px rgba(246,217,140,0.35), 0 0 90px 30px rgba(246,217,140,0.12);
    animation:glow 5s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ box-shadow:0 0 40px 10px rgba(246,217,140,0.35), 0 0 90px 30px rgba(246,217,140,0.12); }
    50%{ box-shadow:0 0 50px 14px rgba(246,217,140,0.5), 0 0 110px 40px rgba(246,217,140,0.2); }
  }

  .content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:480px;
  }

  .eyebrow{
    color:var(--rose);
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-size:11px;
    font-weight:600;
    margin-bottom:10px;
    opacity:0.85;
  }

  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    color:var(--milk-highlight);
    font-size:clamp(28px, 6vw, 42px);
    margin:0 0 6px 0;
  }

  h1 .name{
    font-style:normal;
    color:var(--rose);
  }

  .sub{
    color:#c9c6e8;
    font-size:15px;
    margin:0 0 28px 0;
    line-height:1.5;
  }

  /* glass + milk */
  .glass-wrap{
    position:relative;
    width:150px;
    height:190px;
    margin-bottom:22px;
  }

  svg{ display:block; overflow:visible; }

  .milk-fill{
    transform-origin:bottom;
    animation:none;
  }

  .milk-top{
    animation:wobble 3.2s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes wobble{
    0%,100%{ transform:scaleY(1) translateY(0); }
    50%{ transform:scaleY(0.85) translateY(1px); }
  }

  .steam{
    opacity:0;
    animation:steamRise 4s ease-in infinite;
  }
  .steam.s2{ animation-delay:1.3s; }
  .steam.s3{ animation-delay:2.6s; }

  @keyframes steamRise{
    0%{ opacity:0; transform:translateY(0) scale(1); }
    15%{ opacity:0.55; }
    100%{ opacity:0; transform:translateY(-46px) scale(1.25); }
  }

  .message{
    font-size:16px;
    color:var(--milk);
    line-height:1.7;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:16px;
    padding:18px 22px;
    backdrop-filter:blur(6px);
  }

  .replay{
    margin-top:20px;
    background:none;
    border:1px solid rgba(255,255,255,0.25);
    color:#d8d5f2;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:9px 20px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.25s ease;
  }
  .replay:hover{
    background:rgba(255,255,255,0.08);
    border-color:var(--rose);
    color:#fff;
  }

  .drink-btn{
    position:relative;
    overflow:hidden;
    margin-top:20px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.25);
    color:#d8d5f2;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:12px 28px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color 0.25s ease, color 0.25s ease;
    -webkit-user-select:none;
    user-select:none;
    touch-action:none;
  }
  .drink-btn:hover{
    border-color:var(--rose);
    color:#fff;
  }
  .drink-btn:active{
    border-color:var(--rose);
  }
  .drink-btn-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background:linear-gradient(90deg, rgba(230,164,189,0.45), rgba(255,246,230,0.35));
    z-index:0;
    transition:none;
  }
  .drink-btn-label{
    position:relative;
    z-index:1;
  }
  .drink-btn[hidden]{ display:none; }

  .celebrate-wrap{
    position:relative;
    height:0;
    width:100%;
  }
  .celebrate-text{
    margin-top:18px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:19px;
    color:var(--rose);
    opacity:0;
    transform:translateY(6px);
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .celebrate-text.show{
    opacity:1;
    transform:translateY(0);
  }

  .float-emoji{
    position:absolute;
    bottom:0;
    font-size:20px;
    opacity:0;
    animation:floatUp 2.4s ease-out forwards;
    pointer-events:none;
  }
  @keyframes floatUp{
    0%{ opacity:0; transform:translateY(0) scale(0.6) rotate(0deg); }
    15%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-160px) scale(1.1) rotate(20deg); }
  }

  .footnote{
    position:absolute;
    bottom:18px;
    font-size:11px;
    color:#6b6797;
    letter-spacing:0.05em;
  }
</style>
</head>
<body>

<div class="sky">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>

  <div class="content">
    <h1>goodnight, <span class="name" id="nameDisplay">wiku</span></h1>

    <div class="glass-wrap">
      <svg viewBox="0 0 150 190" width="150" height="190">
        <!-- steam -->
        <g stroke="#fff6e6" stroke-width="3" stroke-linecap="round" fill="none">
          <path class="steam s1" d="M60 55 C 55 42, 68 38, 63 26" />
          <path class="steam s2" d="M75 55 C 70 42, 83 38, 78 26" />
          <path class="steam s3" d="M90 55 C 85 42, 98 38, 93 26" />
        </g>

        <!-- glass body -->
        <path d="M40 55 L48 175 Q75 184 102 175 L110 55 Z"
              fill="rgba(255,255,255,0.04)"
              stroke="rgba(255,255,255,0.35)"
              stroke-width="2.5" />

        <!-- milk fill, clipped to glass shape -->
        <clipPath id="glassClip">
          <path d="M40 55 L48 175 Q75 184 102 175 L110 55 Z" />
        </clipPath>

        <g clip-path="url(#glassClip)">
          <rect id="milkRect" class="milk-fill" x="35" y="180" width="80" height="0"
                fill="var(--milk)" />
          <ellipse class="milk-top" id="milkTop" cx="75" cy="180" rx="34" ry="6" fill="var(--milk-highlight)" opacity="0" />
        </g>

        <!-- glass rim highlight -->
        <ellipse cx="75" cy="55" rx="35" ry="6" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
      </svg>
    </div>

    <div class="message">
      Baby, I may be far from you, but I'll always find little ways to make you feel loved. Here's a little milk from me to you. Drink well, baby, and remember that I love and miss you so much bebe ko Wiku!
    </div>

    <button class="drink-btn" id="drinkBtn">
      <span class="drink-btn-fill" id="drinkFill"></span>
      <span class="drink-btn-label" id="drinkLabel">hold to drink</span>
    </button>

    <div class="celebrate-wrap" id="celebrateWrap">
      <div class="float-emoji-layer" id="emojiLayer"></div>
    </div>
    <div class="celebrate-text" id="celebrateText">Yeyy, very good kaw!</div>
  </div>

  <div class="footnote">xine loves you so much</div>
</div>

<script>
  // stars
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 70;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 70 + '%';
    s.style.animationDelay = (Math.random() * 4) + 's';
    s.style.width = s.style.height = (Math.random() * 1.5 + 1) + 'px';
    starsContainer.appendChild(s);
  }

  // pour animation
  const milkRect = document.getElementById('milkRect');
  const milkTop = document.getElementById('milkTop');
  const FULL_HEIGHT = 122;   // rect spans from y=180 (empty) up to y=58 (full)
  const BOTTOM_Y = 180;
  const TOP_Y = 58;

  let milkLevel = 0;        // 0 = empty, 1 = full
  let pouring = false;
  let drinking = false;
  let finished = false;
  let drinkFrame = null;
  let lastFrameTime = null;
  const DRINK_DURATION = 2800; // ms to fully drink when held continuously

  const drinkBtn = document.getElementById('drinkBtn');
  const drinkFill = document.getElementById('drinkFill');
  const drinkLabel = document.getElementById('drinkLabel');
  const celebrateText = document.getElementById('celebrateText');
  const emojiLayer = document.getElementById('emojiLayer');

  function applyMilkLevel(level){
    const y = BOTTOM_Y - level * FULL_HEIGHT;
    const h = level * FULL_HEIGHT;
    milkRect.setAttribute('y', y);
    milkRect.setAttribute('height', h);
    milkTop.setAttribute('cy', y);
    milkTop.style.opacity = level > 0.02 ? 1 : 0;
    drinkFill.style.width = ((1 - level) * 100) + '%';
  }

  function pourMilk(){
    pouring = true;
    finished = false;
    milkLevel = 0;
    milkRect.style.transition = 'none';
    milkTop.style.transition = 'none';
    applyMilkLevel(0);

    drinkBtn.hidden = true;
    celebrateText.classList.remove('show');
    emojiLayer.innerHTML = '';

    void milkRect.getBoundingClientRect();

    requestAnimationFrame(() => {
      milkRect.style.transition = 'height 2.6s cubic-bezier(.32,.9,.34,1), y 2.6s cubic-bezier(.32,.9,.34,1)';
      milkTop.style.transition = 'cy 2.6s cubic-bezier(.32,.9,.34,1), opacity 0.6s ease 1.8s';
      milkLevel = 1;
      applyMilkLevel(1);
    });

    setTimeout(() => {
      pouring = false;
      milkRect.style.transition = 'none';
      milkTop.style.transition = 'none';
      drinkLabel.textContent = 'hold to drink';
      drinkFill.style.width = '0%';
      drinkBtn.hidden = false;
    }, 2650);
  }

  function drinkStep(timestamp){
    if (!drinking) return;
    if (lastFrameTime === null) lastFrameTime = timestamp;
    const dt = timestamp - lastFrameTime;
    lastFrameTime = timestamp;

    milkLevel = Math.max(0, milkLevel - dt / DRINK_DURATION);
    applyMilkLevel(milkLevel);

    if (milkLevel <= 0){
      drinking = false;
      finishDrink();
      return;
    }
    drinkFrame = requestAnimationFrame(drinkStep);
  }

  function startDrinking(){
    if (pouring || finished || drinking) return;
    drinking = true;
    lastFrameTime = null;
    drinkLabel.textContent = 'drinking...';
    drinkFrame = requestAnimationFrame(drinkStep);
  }

  function pauseDrinking(){
    if (!drinking) return;
    drinking = false;
    lastFrameTime = null;
    if (drinkFrame) cancelAnimationFrame(drinkFrame);
    if (!finished) drinkLabel.textContent = 'hold to drink';
  }

  function spawnCelebration(){
    const symbols = ['💛','✨','🌙','💫','🤍'];
    const count = 16;
    for (let i = 0; i < count; i++){
      const el = document.createElement('span');
      el.className = 'float-emoji';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = (10 + Math.random() * 80) + '%';
      el.style.animationDelay = (Math.random() * 0.5) + 's';
      el.style.fontSize = (14 + Math.random() * 14) + 'px';
      emojiLayer.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
  }

  function finishDrink(){
    finished = true;
    drinkBtn.hidden = true;
    spawnCelebration();
    requestAnimationFrame(() => celebrateText.classList.add('show'));

    setTimeout(() => {
      drinkLabel.textContent = 'pour again';
      drinkBtn.hidden = false;
    }, 1600);
  }

  drinkBtn.addEventListener('click', () => {
    if (finished) pourMilk();
  });

  drinkBtn.addEventListener('pointerdown', (e) => {
    if (finished) return;
    e.preventDefault();
    startDrinking();
  });
  ['pointerup','pointerleave','pointercancel'].forEach(evt => {
    drinkBtn.addEventListener(evt, pauseDrinking);
  });

  pourMilk();

</script>

</body>
</html>
